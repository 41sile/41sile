<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="refresh" content="0; url=https://discord.gg/sq3EpqQMGD">
	<title>Discord – Sile</title>
	<link rel="icon" href="../logo.png" type="image/png">
	<style>
		html {
			font-size: 16px;
		}
		*, *::before, *::after {
			box-sizing: border-box;
		}
		body {
			font-family: sans-serif;
			max-width: 600px;
			margin: 0 auto;
			padding: 80px 40px 60px;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			justify-content: flex-start;
			align-items: center;
			text-align: center;
			line-height: 1.5;
		}
		.main-typo {
			font-size: clamp(2rem, 5.5vw, 3.2rem);
			margin: 0 0 0.3em 0;
			word-break: keep-all;
			line-height: 1.4;
		}
		.sub-text {
			font-size: clamp(16px, 1.6vw, 18px);
			color: #000000b5;
			margin-bottom: 36px;
		}
		.discord-btn {
			display: inline-block;
			background-color: #111111;
			color: #ffffff;
			padding: 16px 32px;
			font-size: clamp(16px, 1.6vw, 20px);
			font-weight: 600;
			text-decoration: none;
			border-radius: 8px;
			transition: background-color 0.2s ease;
		}
		.discord-btn:hover {
			background-color: #333333;
		}
		.back-link {
			display: inline-block;
			margin-top: 24px;
			font-size: 15px;
			color: #666666;
			text-decoration: underline;
			text-underline-offset: 3px;
			transition: color 0.2s ease;
		}
		.back-link:hover {
			color: #333333;
		}
	</style>
</head>
<body>
	<p class="main-typo">Redirecting to Discord...</p>
	<p class="sub-text">If you are not redirected automatically, click the button below.</p>
	<a class="discord-btn" href="https://discord.gg/sq3EpqQMGD">Join Discord Server</a>
	<a class="back-link" href="../">← Back to sile.to</a>
	<script>
		window.location.href = "https://discord.gg/sq3EpqQMGD";
	</script>
</body>
</html>
